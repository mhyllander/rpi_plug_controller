<html>
    <head>
        <title>{{.PageTitle}}</title>
        <script type='text/javascript'>
            function getConfig() {
                
            }
            function sendConfig() {

            }
        </script>
    </head>
    <body>
        <style>
            table, th, td {
                border: 1px solid black;
                border-collapse: collapse;
            }
            th, td {
              padding: 10px;
            }
            thead {
                color: green;
            }
        </style>
        <h1>{{ .PageTitle }}</h1>
        <h2>Sensors</h2>
        <table>
            <thead>
                <tr><th>Sensor</th><th>IP</th><th>Plug</th><th>State</th><th>Updated</th></tr>
            </thead>
            <tbody>
                {{ range .Sensors -}}
                <tr><td>{{ .SensorId }}</td><td><a href="http://{{ .IpAddress }}" target="_blank">{{ .IpAddress }}</a></td><td>{{ .PlugId }}</td><td>{{ .State }}</td><td>{{ .UpdatedAt }}</td></tr>
                {{ end -}}
            </tbody>
        </table>
        <h2>Plugs</h2>
        <table>
            <thead>
                <tr><th>Plug</th><th>IP</th><th>State</th><th>Updated</th><th>Response</th></tr>
            </thead>
            <tbody>
                {{ range .Plugs -}}
                <tr><td>{{ .PlugId }}</td><td><a href="http://{{ .IpAddress }}" target="_blank">{{ .IpAddress }}</a></td><td>{{ .State }}</td><td>{{ .UpdatedAt }}</td><td>{{ .Response }}</td></tr>
                {{ end -}}
            </tbody>
        </table>
   </body>
</html>
